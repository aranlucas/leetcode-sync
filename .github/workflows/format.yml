name: Format
'on':
  workflow_dispatch: null
  push:
    branches:
      - main
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'corretto'
          java-version: 17
      - uses: axel-op/googlejavaformat-action@v4.0.0
        with:
          args: "--replace -a --skip-javadoc-formatting"
